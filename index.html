<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World News Globe</title>
    <script src="https://unpkg.com/globe.gl@0.0.0/dist/globe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: Arial, sans-serif; }
        #globe { width: 100vw; height: 100vh; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; max-width: 400px; display: none; }
        #legend { position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="globe"></div>
    <div id="info">
        <h2 id="country-name"></h2>
        <div id="headlines"></div>
    </div>
    <div id="legend">
        <strong>News Sentiment:</strong><br>
        🟢 Good &nbsp; 🟡 Neutral &nbsp; 🔴 Bad<br>
        Gray: No recent news
    </div>

    <script>
        // You'll need a News API key - replace YOUR_API_KEY
        const NEWS_API_KEY = 'YOUR_API_KEY_HERE'; // Get from newsapi.org

        const globe = Globe()
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
            .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
            .polygonsData([]) // Will load later
            .polygonAltitude(0.01)
            .polygonCapColor(d => d.color || '#444444')
            .polygonSideColor(() => '#222')
            .polygonStrokeColor(() => '#555')
            .onPolygonClick(handleCountryClick);

        document.getElementById('globe').appendChild(globe.domElement);

        // Load world countries
        fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
            .then(r => r.json())
            .then(countries => {
                const countriesWithData = countries.features.map(country => ({
                    ...country,
                    color: '#444444', // default gray
                    news: []
                }));
                globe.polygonsData(countriesWithData);

                // Simulate some news colors for demo
                simulateNews(countriesWithData);
            });

        function simulateNews(countries) {
            // For demo purposes
            setTimeout(() => {
                countries.forEach(c => {
                    if (Math.random() > 0.7) {
                        c.color = ['#22c55e', '#eab308', '#ef4444'][Math.floor(Math.random()*3)];
                    }
                });
                globe.polygonsData(countries);
            }, 1500);
        }

        async function handleCountryClick(polygon) {
            const countryName = polygon.properties.name || polygon.properties.NAME || 'Unknown';
            document.getElementById('country-name').textContent = countryName;

            const infoPanel = document.getElementById('info');
            const headlinesDiv = document.getElementById('headlines');
            headlinesDiv.innerHTML = '<p>Loading news...</p>';
            infoPanel.style.display = 'block';

            try {
                // Example using NewsAPI (replace with actual call)
                const response = await fetch(`https://newsapi.org/v2/top-headlines?country=${getCountryCode(countryName)}&apiKey=${NEWS_API_KEY}`);
                const data = await response.json();

                if (data.articles && data.articles.length > 0) {
                    headlinesDiv.innerHTML = data.articles.slice(0,5).map(article => `
                        <div style="margin-bottom:12px;">
                            <a href="${article.url}" target="_blank" style="color:#60a5fa;">${article.title}</a>
                            <p style="font-size:0.9em; color:#aaa;">${article.description || ''}</p>
                        </div>
                    `).join('');
                } else {
                    headlinesDiv.innerHTML = '<p>No recent news found.</p>';
                }
            } catch(e) {
                headlinesDiv.innerHTML = '<p>Error loading news. Please add your NewsAPI key.</p>';
            }
        }

        function getCountryCode(name) {
            // Simple mapping - expand this
            const map = { 'United States': 'us', 'India': 'in', 'United Kingdom': 'gb', 'Germany': 'de' /* add more */ };
            return map[name] || 'us';
        }

        // Add resize handler
        window.addEventListener('resize', () => globe.width(window.innerWidth).height(window.innerHeight));
    </script>
</body>
</html>
