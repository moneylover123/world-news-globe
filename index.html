<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobeWatch • Global News Pulse</title>
    <script src="https://unpkg.com/globe.gl@2.32.0/dist/globe.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }
        #globe-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        .header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            padding: 12px 32px;
            border-radius: 9999px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 600;
            background: linear-gradient(90deg, #00ff9f, #00b4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar {
            position: absolute;
            top: 100px;
            right: 30px;
            width: 380px;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 24px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            z-index: 200;
            display: none;
        }
        .sidebar.active { display: block; }
        .country-name {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .news-item {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }
        .news-item:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
        .legend {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(15,15,15,0.9);
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }
        .legend-item { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
        .color-dot {
            width: 18px; height: 18px; border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="globe-container"></div>

    <div class="header">
        <div class="logo">🌍 GlobeWatch</div>
        <div style="font-size:14px; opacity:0.7;">Live Global News Intelligence</div>
    </div>

    <div id="sidebar" class="sidebar">
        <h2 id="selected-country" class="country-name"></h2>
        <div id="news-container"></div>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="color-dot" style="background:#22c55e;"></div><span>Positive News</span></div>
        <div class="legend-item"><div class="color-dot" style="background:#eab308;"></div><span>Neutral / Mixed</span></div>
        <div class="legend-item"><div class="color-dot" style="background:#ef4444;"></div><span>Negative / Crisis</span></div>
    </div>

    <script>
        const API_KEY = 'ef3979cdd3c5472ab30dbe21f7511646';
        let globe;

        // Country code mapping helper
        const countryToIso = {
            "United States": "us", "USA": "us",
            "United Kingdom": "gb", "UK": "gb",
            "India": "in", "China": "cn", "Russia": "ru",
            "Germany": "de", "France": "fr", "Japan": "jp",
            // Add more as needed
        };

        async function fetchNews(countryCode) {
            if (!countryCode) return [];
            try {
                const res = await fetch(`https://newsapi.org/v2/top-headlines?country=${countryCode}&apiKey=${API_KEY}&pageSize=8`);
                const data = await res.json();
                return data.articles || [];
            } catch (e) {
                console.error("News fetch failed", e);
                return [];
            }
        }

        function getSentimentColor() {
            const rand = Math.random();
            if (rand < 0.4) return '#22c55e'; // green good
            if (rand < 0.75) return '#eab308'; // yellow
            return '#ef4444'; // red
        }

        // Initialize Globe
        async function initGlobe() {
            globe = Globe()
                .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
                .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
                .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
                .atmosphereColor('#00b4ff')
                .atmosphereAltitude(0.25)
                .width(window.innerWidth)
                .height(window.innerHeight)
                .showAtmosphere(true)
                .polygonSideColor(() => 'rgba(255,255,255,0.15)')
                .polygonStrokeColor(() => '#ffffff')
                .polygonAltitude(0.01)
                .onPolygonClick(async (polygonData) => {
                    const countryName = polygonData.properties.ADMIN || polygonData.properties.NAME;
                    const isoCode = countryToIso[countryName] || polygonData.properties.ISO_A2?.toLowerCase();
                    
                    document.getElementById('selected-country').textContent = countryName;
                    const sidebar = document.getElementById('sidebar');
                    sidebar.classList.add('active');

                    const newsContainer = document.getElementById('news-container');
                    newsContainer.innerHTML = '<p style="opacity:0.6">Loading latest news...</p>';

                    const articles = await fetchNews(isoCode);
                    
                    let html = '';
                    if (articles.length > 0) {
                        articles.forEach(article => {
                            html += `
                                <div class="news-item">
                                    <h4 style="margin-bottom:8px;">${article.title}</h4>
                                    <p style="font-size:14px; opacity:0.8; line-height:1.4;">${article.description || 'No description available.'}</p>
                                    <a href="${article.url}" target="_blank" style="color:#00b4ff; font-size:13px; text-decoration:none;">Read full story →</a>
                                </div>
                            `;
                        });
                    } else {
                        html = '<p style="opacity:0.7">No recent headlines found for this country.</p>';
                    }
                    newsContainer.innerHTML = html;
                });

            // Load countries
            const countries = await (await fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')).json();
            
            globe.polygonsData(countries.features)
                 .polygonCapColor(d => getSentimentColor())
                 .polygonLabel(d => `
                    <div style="background:rgba(0,0,0,0.85); padding:8px 12px; border-radius:8px; font-size:13px;">
                        ${d.properties.ADMIN}
                    </div>
                 `);

            document.getElementById('globe-container').appendChild(globe);
            
            // Auto-rotate
            globe.controls().autoRotate = true;
            globe.controls().autoRotateSpeed = 0.3;
        }

        // Resize handler
        window.addEventListener('resize', () => {
            if (globe) {
                globe.width(window.innerWidth).height(window.innerHeight);
            }
        });

        // Close sidebar on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('sidebar').classList.remove('active');
            }
        });

        // Init
        initGlobe();
    </script>
</body>
</html>
